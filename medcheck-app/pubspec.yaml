name: pill_reminder_app
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.1
  go_router: ^17.1.0
  connectivity_plus: ^6.1.5
  flutter_dotenv: ^6.0.0
  flutter_local_notifications: ^20.1.0
  timezone: ^0.10.1
  permission_handler: ^12.0.1
  intl: ^0.20.2
  flutter_svg: ^2.2.4
  google_sign_in: ^7.2.0
  isar_community: ^3.3.0-dev.3
  isar_community_flutter_libs: ^3.3.0-dev.3
  google_fonts: ^8.0.2
  path_provider: ^2.1.5
  lottie: ^3.1.0
  fl_chart: ^1.2.0
  dio: ^5.9.2
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.2.0
  firebase_core: ^3.12.1
  firebase_messaging: ^15.2.4
  flutter_cached_pdfview: ^0.4.3
  share_plus: ^12.0.2
  flutter_timezone: ^5.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: 2.7.1
  flutter_lints: ^5.0.0
  isar_community_generator: ^3.3.0-dev.3
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#A294F9"
  adaptive_icon_foreground: "assets/images/logo.png"
  web:
    generate: false

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/images/
    - assets/icons/
    - assets/lotties/
