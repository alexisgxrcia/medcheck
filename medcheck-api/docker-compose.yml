services:
  roach1:
    image: cockroachdb/cockroach:latest
    command:
      - start
      - --insecure
      - --cluster-name=medcheck-cluster
      - --advertise-addr=roach1
      - --http-addr=0.0.0.0:8080
      - --listen-addr=0.0.0.0:26257
      - --join=roach1,roach2,roach3
      - --cache=128MiB
      - --max-sql-memory=128MiB
    volumes:
      - roach1-data:/cockroach/cockroach-data
    healthcheck:
      test: ["CMD", "cockroach", "sql", "--insecure", "--host=localhost:26257", "--execute", "SELECT 1"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 30s
    networks:
      - backend-net

  roach2:
    image: cockroachdb/cockroach:latest
    command:
      - start
      - --insecure
      - --cluster-name=medcheck-cluster
      - --advertise-addr=roach2
      - --http-addr=0.0.0.0:8080
      - --listen-addr=0.0.0.0:26257
      - --join=roach1,roach2,roach3
      - --cache=128MiB
      - --max-sql-memory=128MiB
    volumes:
      - roach2-data:/cockroach/cockroach-data
    healthcheck:
      test: ["CMD", "cockroach", "sql", "--insecure", "--host=localhost:26257", "--execute", "SELECT 1"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 30s
    networks:
      - backend-net

  roach3:
    image: cockroachdb/cockroach:latest
    command:
      - start
      - --insecure
      - --cluster-name=medcheck-cluster
      - --advertise-addr=roach3
      - --http-addr=0.0.0.0:8080
      - --listen-addr=0.0.0.0:26257
      - --join=roach1,roach2,roach3
      - --cache=128MiB
      - --max-sql-memory=128MiB
    volumes:
      - roach3-data:/cockroach/cockroach-data
    healthcheck:
      test: ["CMD", "cockroach", "sql", "--insecure", "--host=localhost:26257", "--execute", "SELECT 1"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 30s
    networks:
      - backend-net

  init:
    image: cockroachdb/cockroach:latest
    depends_on:
      - roach1
      - roach2
      - roach3
    entrypoint: ["/bin/sh", "/scripts/init-cluster.sh"]
    volumes:
      - ./docker/init-cluster.sh:/scripts/init-cluster.sh:ro
    restart: "no"
    networks:
      - backend-net

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - redis-data:/data
    networks:
      - backend-net

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: ${NODE_ENV}
      PORT: ${PORT}
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_ID_IOS: ${GOOGLE_CLIENT_ID_IOS}
      GOOGLE_CLIENT_ID_ANDROID: ${GOOGLE_CLIENT_ID_ANDROID}
      GOOGLE_CLIENT_ID_ANDROID_ALT: ${GOOGLE_CLIENT_ID_ANDROID_ALT}
      FIREBASE_SERVICE_ACCOUNT: ${FIREBASE_SERVICE_ACCOUNT}
      RESEND_API_KEY: ${RESEND_API_KEY}
      REDIS_URL: ${REDIS_URL}
    expose:
      - "3000"
    depends_on:
      init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      replicas: 2
    networks:
      - backend-net

  notifier:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["node", "dist/notifier.js"]
    environment:
      NODE_ENV: ${NODE_ENV}
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_ID_IOS: ${GOOGLE_CLIENT_ID_IOS}
      GOOGLE_CLIENT_ID_ANDROID: ${GOOGLE_CLIENT_ID_ANDROID}
      GOOGLE_CLIENT_ID_ANDROID_ALT: ${GOOGLE_CLIENT_ID_ANDROID_ALT}
      FIREBASE_SERVICE_ACCOUNT: ${FIREBASE_SERVICE_ACCOUNT}
      RESEND_API_KEY: ${RESEND_API_KEY}
      REDIS_URL: ${REDIS_URL}
    depends_on:
      init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - backend-net

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - api
    command:
      - /bin/sh
      - -c
      - |
        if [ -f /etc/letsencrypt/live/api.example.com/fullchain.pem ]; then
          cp /etc/nginx/templates/nginx.ssl.conf /etc/nginx/nginx.conf;
        else
          cp /etc/nginx/templates/nginx.http.conf /etc/nginx/nginx.conf;
        fi
        exec nginx -g 'daemon off;'
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/templates/nginx.ssl.conf:ro
      - ./nginx.http-only.conf:/etc/nginx/templates/nginx.http.conf:ro
      - certbot-www:/var/www/certbot
      - letsencrypt:/etc/letsencrypt
    restart: unless-stopped
    networks:
      - backend-net

  certbot:
    image: certbot/certbot:latest
    volumes:
      - certbot-www:/var/www/certbot
      - letsencrypt:/etc/letsencrypt
    entrypoint: ["/bin/sh", "-c"]
    command: ["trap exit TERM; while :; do sleep 6h; done"]

volumes:
  roach1-data:
  roach2-data:
  roach3-data:
  redis-data:
  certbot-www:
  letsencrypt:

networks:
  backend-net:
    driver: bridge
